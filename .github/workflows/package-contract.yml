name: Package contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Skills reach both targets with every reference; manifests, versions, the
      # Claude compatibility façade, and the shipped docs' skill count agree.
      - name: Package contract
        run: npm run test:build
      # Every gate a scenario grades still exists in the canonical references.
      - name: Skill scenario integrity
        run: npm run test:scenarios
      - run: npm run build -- --target all
      - name: Verify all committed generated files are current
        run: |
          git diff --exit-code
          git add -A -N
          git diff --exit-code
