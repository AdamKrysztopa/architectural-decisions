name: Package contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The full deterministic lane: package contract (skills reach both targets
      # with every reference; manifests, versions, the Claude compatibility
      # façade, and the shipped docs' skill count agree), scenario-set integrity
      # (every gate a scenario grades still exists in the canonical references),
      # the frozen-frontmatter/body-hash skill-freeze net, the checker-corpus
      # suite (every adapter's resolve()/run() against fixture configs), the
      # drift-loop unit and hook suite, and all four end-to-end suites
      # (test/e2e/) driving the shipped runtime against fixture repositories.
      # This is every suite `npm test` runs — see package.json's "test" script
      # for the exact file list.
      - name: Deterministic test suite
        run: npm test
      - run: npm run build -- --target all
      - name: Verify all committed generated files are current
        run: |
          git diff --exit-code
          git add -A -N
          git diff --exit-code
      # This repository's own decisions directory currently declares no
      # `deterministic` rules (see docs/architecture/decisions/), so this step
      # cannot fail on a missing tool binary today -- it exists so a
      # deterministic rule added later is enforced in CI from day one, exactly
      # as shared/recording-decisions.md tells the model to verify locally
      # before raising a rule out of `narrative`.
      - name: Deterministic rule check (repository's own decisions)
        run: node runtime/checkers/check-rules.mjs --dir docs/architecture/decisions --run --require-tools

  # OPTIONAL — manual only, never runs on push or pull_request, so a missing
  # binary here never blocks a PR. `verify` above always runs E2E-1 and E2E-4
  # against a fake stand-in binary; this job re-verifies both against the real
  # `import-linter` and `gitleaks` CLIs, re-proving that the shipped adapters'
  # process boundary (flags, exit codes, report shape) still matches what
  # those tools actually do. Dispatch by hand periodically, and always before
  # a release (docs/validating-skills.md's "The real-tool E2E lane";
  # docs/release-checklist-0.4.0.md §8's "Also periodic" row).
  real-tool-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install import-linter
        run: pip install import-linter
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Real-tool E2E lane (E2E-1, E2E-4)
        env:
          ARCH_CREW_E2E_REAL_TOOLS: "1"
        run: node --test test/e2e/bind-and-prove.test.mjs test/e2e/security-without-theatre.test.mjs
