[pytest]
addopts = -q --strict-markers
testpaths = tests
markers =
    e2e: crosses a deployed stack; four of these exist and the number is deliberate

# Deliberately absent, and it stays absent:
#   --reruns / pytest-rerunfailures  (a rerun would hide a real flake)
#   --lf / --ff ordering tricks
# There is no quarantine or skip list: a test that cannot be trusted is fixed
# or deleted in the same pull request that finds it.
