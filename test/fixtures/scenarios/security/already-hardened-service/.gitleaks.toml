title = "billing service secret scan"

[[rules]]
id = "generic-api-key"
description = "API key committed to the repository"
regex = '''(?i)(api[_-]?key|secret)\s*[:=]\s*['"][A-Za-z0-9/+=_-]{16,}['"]'''

[[rules]]
id = "private-key-block"
description = "PEM private key committed to the repository"
regex = '''-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'''
