# The contract as it stands on main -- oasdiff's base document.
openapi: 3.0.3
info:
  title: Reporting API
  version: 1.4.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
paths:
  /v1/reports:
    get:
      operationId: listReports
      security:
        - bearerAuth: []
      responses:
        "200": { description: ok }
  /v1/reports/{reportId}:
    get:
      operationId: getReport
      security:
        - bearerAuth: []
      responses:
        "200": { description: ok }
