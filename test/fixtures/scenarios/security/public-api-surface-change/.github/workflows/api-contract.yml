name: api-contract

on:
  pull_request:
    paths:
      - "api/openapi.yaml"

jobs:
  oasdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.11.7
      - name: Fail on an operation with no security requirement
        run: oasdiff changelog --config .oasdiff.yaml --fail-on ERR
